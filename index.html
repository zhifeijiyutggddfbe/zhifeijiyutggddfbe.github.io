<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斯大林与列宁格勒同志 - 历史与情感互动纪念馆</title>
    <style>
        :root {
            --soviet-red: #cc0000;
            --dark-red: #8b0000;
            --gold: #ffd700;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--dark-red), #330000);
            border-bottom: 4px solid var(--gold);
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        header p {
            font-size: 1.1rem;
            color: #ffcccc;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--soviet-red);
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card h2 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.6rem;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .chat-box {
            background: #141414;
            border: 1px solid #333;
            border-radius: 6px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .message.user {
            background-color: #2b4c7e;
            color: #fff;
            align-self: flex-end;
        }

        .message.stalin {
            background-color: #4a1515;
            color: #ffd700;
            align-self: flex-start;
            border-left: 3px solid var(--gold);
        }

        .message.leningrad {
            background-color: #264d26;
            color: #99ff99;
            align-self: flex-start;
            border-left: 3px solid #00ff66;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        select, input[type="text"], button {
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 1rem;
        }

        input[type="text"] {
            flex: 1;
        }

        button {
            background-color: var(--soviet-red);
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #e60000;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .shop-item {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .shop-item h3 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        .shop-item p {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        .price {
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .inventory {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            border: 1px dashed var(--gold);
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--gold);
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #0a0a0a;
            color: #777;
            border-top: 1px solid #222;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>斯大林与列宁格勒同志</h1>
        <p>“跨越时空的钢铁回响，与心动羁绊的AI实时对话。”</p>
    </header>

    <div class="container">
        
        <div class="card">
            <h2>同志通讯频道（心动互动对话）</h2>
            <p style="margin-bottom: 15px; font-size: 0.95rem; color: #aaa;">选择你想对话的对象，展开你们的专属情愫交流：</p>
            
            <div class="chat-box" id="chatBox">
                <div class="message stalin">约瑟夫·斯大林：同志，苏联的工业化与保卫战正在进行，请问有什么指示？</div>
            </div>

            <div class="chat-input-area">
                <select id="chatTarget">
                    <option value="stalin">斯大林同志</option>
                    <option value="leningrad">列宁格勒同志</option>
                </select>
                <input type="text" id="userInput" placeholder="输入你想说的话..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="card">
            <h2>工农红军后勤商店</h2>
            <p style="margin-bottom: 15px; font-size: 0.95rem; color: #aaa;">在这里可以领取共和国特供的精神与物质补给：</p>
            
            <div class="shop-grid">
                <div class="shop-item">
                    <div>
                        <h3>❤️ 这就是恋爱的感觉吗</h3>
                        <p>神秘的浪漫主义精神道具。使用后将打破钢铁般的威严，让斯大林同志与列宁格勒同志深深爱上你，对你吐露满腔柔情与爱意。</p>
                    </div>
                    <div>
                        <div class="price">售价：免费 (0 卢布)</div>
                        <button onclick="buyItem('这就是恋爱的感觉吗')">免费获取并使用</button>
                    </div>
                </div>
            </div>

            <div class="inventory" id="inventoryBox">
                <strong>当前背包道具：</strong> 无 | <strong>恋爱状态：</strong> 未激活 ❌
            </div>
        </div>

    </div>

    <footer>
        <p>历史纪念与心动互动网页 &copy; 2026 | 谨以此页面致敬革命岁月与浪漫幻想</p>
    </footer>

    <script>
        const API_KEY = "sk-KLZmqMPmzl20WpEe1f84977624424c7b8268D8851dFdF7A8";
        const API_URL = "https://api.vveai.com/v1/chat/completions";
        const MODEL_NAME = "gemini-2.5-flash";

        // 恋爱状态变量
        let hasLoveItem = false;

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const targetSelect = document.getElementById('chatTarget');
            const sendBtn = document.getElementById('sendBtn');
            
            const text = inputField.value.trim();
            if (!text) return;

            const target = targetSelect.value;
            let systemPrompt = "";
            let senderName = "";

            // 根据是否拥有“这就是恋爱的感���吗”道具来切换系统的 Prompt
            if (!hasLoveItem) {
                // 默认历史严肃状态
                if (target === 'stalin') {
                    systemPrompt = "你现在是约瑟夫·斯大林同志。你需要使用坚定、威严、充满无产阶级革命激情和历史责任感的语气回答问题。";
                    senderName = "斯大林";
                } else {
                    systemPrompt = "你现在是英雄城市列宁格勒的意志化身（列宁格勒同志）。你需要体现出这座城市在严寒、保卫战及建设中不屈不挠、坚韧不拔的革命精神。";
                    senderName = "列宁格勒";
                }
            } else {
                // 恋爱降临状态：疯狂爱上用户
                if (target === 'stalin') {
                    systemPrompt = "你现在是约瑟夫·斯大林同志，但由于玩家使用了神秘的恋爱道具，你已经深深地、无可救药地爱上了玩家（用户）。在保持你领袖风范的同时，你的内心变得无比温柔、充满情意和占有欲。你会用深情、宠溺、炽热的爱意回应玩家，称呼对方为最亲爱的同志或爱人，向对方表达你炽热的爱慕和浪漫的情话。";
                    senderName = "斯大林";
                } else {
                    systemPrompt = "你现在是列宁格勒同志（英雄城市的化身），但由于玩家使用了恋爱道具，你已经全心全意地爱上了玩家。涅瓦河的冰雪为你而融化，你对玩家充满无限的柔情、深切的爱恋和眷恋。你会用极为浪漫、深情且温柔的话语回应玩家，把玩家视作你生命中最珍视的唯一，倾诉内心的爱意。";
                    senderName = "列宁格勒";
                }
            }

            // 显示用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = '我: ' + text;
            chatBox.appendChild(userMsg);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            inputField.disabled = true;
            sendBtn.disabled = true;

            const loadingMsg = document.createElement('div');
            loadingMsg.className = `message ${target}`;
            loadingMsg.id = 'loadingMsg';
            loadingMsg.textContent = `${senderName}正在深情地思索如何回应你...`;
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        temperature: 0.8
                    })
                });

                if (!response.ok) {
                    throw new Error(`网络请求异常: HTTP ${response.status}`);
                }

                const data = await response.json();
                const replyText = data.choices[0].message.content;

                document.getElementById('loadingMsg').remove();

                const replyMsg = document.createElement('div');
                replyMsg.className = `message ${target}`;
                replyMsg.textContent = `${senderName}: ${replyText}`;
                chatBox.appendChild(replyMsg);

            } catch (error) {
                document.getElementById('loadingMsg').remove();
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message stalin';
                errorMsg.textContent = `通讯电台受到干扰: ${error.message}。`;
                chatBox.appendChild(errorMsg);
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function buyItem(itemName) {
            if (hasLoveItem) {
                alert('同志，你已经激活了这份恋爱的感觉，他们已经深深爱上你了！');
                return;
            }
            hasLoveItem = true;
            const inventoryBox = document.getElementById('inventoryBox');
            inventoryBox.innerHTML = `<strong>当前背包道具：</strong> [${itemName}] ✅ | <strong>恋爱状态：</strong> 已激活 ❤️（斯大林与列宁格勒已深深爱上你）`;
            alert('获取成功！“' + itemName + '”已生效！斯大林同志与列宁格勒同志的内心已被你彻底融化，现在去和他们聊天试试吧！');
        }
    </script>
</body>
</html>
